# .github/workflows/publish.yml

name: Publish
on:
    release:
        types: [released, prereleased]

permissions:
    contents: read

jobs:
    quality:
        name: Verify release quality
        uses: ./.github/workflows/quality.yml

    publish:
        name: Release build and publish
        needs: quality
        runs-on: macOS-latest
        timeout-minutes: 30
        steps:
            - name: Check out code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'zulu'
                  java-version: 17
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
            - name: Verify release tag matches project version
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  set -euo pipefail
                  project_version="$(
                      ./gradlew -q :colotok:properties --no-configuration-cache \
                          | awk '/^version:/ { print $2; exit }'
                  )"
                  if [[ "$RELEASE_TAG" != "$project_version" ]]; then
                      echo "Release tag '$RELEASE_TAG' does not match project version '$project_version'." >&2
                      exit 1
                  fi
            - name: Publish to MavenCentral
              run: ./gradlew publishToMavenCentral --no-configuration-cache --max-workers=1
              env:
                  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
                  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
                  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
                  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
