name: Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_call:
        secrets:
            CODECOV_TOKEN:
                required: false

permissions:
    contents: read

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    INSTANCE: Writerside/cd
    ARTIFACT: webHelpCD2-all.zip
    DOCKER_VERSION: 233.4797

jobs:
    jvm:
        name: JVM tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 17
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
            - name: Run JVM tests
              run: >-
                  ./gradlew
                  :colotok:jvmTest
                  :colotok-coroutines:jvmTest
                  :colotok-loki:jvmTest
                  :colotok-cloudwatch:test
                  :colotok-slf4j:test
                  :colotok-slf4j2:test
                  :colotok:koverXmlReport
                  --no-configuration-cache
                  --max-workers=1
            - name: Upload coverage to Codecov
              if: ${{ env.CODECOV_TOKEN != '' }}
              uses: codecov/codecov-action@v4
              with:
                  token: ${{ env.CODECOV_TOKEN }}
                  files: "**/build/reports/kover/report.xml"
                  fail_ci_if_error: true

    node:
        name: Node tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 17
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
            - name: Run Node tests
              run: >-
                  ./gradlew
                  :colotok:jsNodeTest
                  :colotok-coroutines:jsNodeTest
                  :colotok-loki:jsNodeTest
                  --no-configuration-cache
                  --max-workers=1

    android:
        name: Android unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 17
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
            - name: Run Android unit tests
              run: >-
                  ./gradlew
                  :colotok:testAndroidHostTest
                  :colotok-coroutines:testAndroidHostTest
                  :colotok-loki:testAndroidHostTest
                  --no-configuration-cache
                  --max-workers=1

    abi:
        name: Public API compatibility
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 17
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
            - name: Check public API dumps
              run: ./gradlew apiCheck checkKotlinAbi --no-configuration-cache --max-workers=1

    consumers:
        name: Published consumer smoke tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 17
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
            - name: Verify isolated published consumers
              run: quality/consumers/run.sh

    apple:
        name: Apple compile and tests
        runs-on: macos-latest
        timeout-minutes: 30
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 17
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
            - name: Compile iOS tests
              run: >-
                  ./gradlew
                  :colotok:compileTestKotlinIosArm64
                  :colotok:compileTestKotlinIosSimulatorArm64
                  :colotok:compileTestKotlinIosX64
                  :colotok:compileTestKotlinMacosArm64
                  :colotok:compileTestKotlinMacosX64
                  :colotok-coroutines:compileTestKotlinIosArm64
                  :colotok-coroutines:compileTestKotlinIosSimulatorArm64
                  :colotok-coroutines:compileTestKotlinIosX64
                  :colotok-coroutines:compileTestKotlinMacosArm64
                  :colotok-coroutines:compileTestKotlinMacosX64
                  :colotok-loki:compileTestKotlinIosArm64
                  :colotok-loki:compileTestKotlinIosSimulatorArm64
                  :colotok-loki:compileTestKotlinIosX64
                  :colotok-loki:compileTestKotlinMacosArm64
                  :colotok-loki:compileTestKotlinMacosX64
                  --no-configuration-cache
                  --max-workers=1
            - name: Run macOS tests
              shell: bash
              run: |
                  if [[ "$(uname -m)" == "arm64" ]]; then
                      target="macosArm64Test"
                  else
                      target="macosX64Test"
                  fi
                  ./gradlew \
                      ":colotok:${target}" \
                      ":colotok-coroutines:${target}" \
                      ":colotok-loki:${target}" \
                      --no-configuration-cache \
                      --max-workers=1

    docs:
        name: Documentation
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Build Writerside documentation
              uses: JetBrains/writerside-github-action@v4
              with:
                  instance: ${{ env.INSTANCE }}
                  artifact: ${{ env.ARTIFACT }}
                  docker-version: ${{ env.DOCKER_VERSION }}
            - name: Check Writerside documentation
              uses: JetBrains/writerside-checker-action@v1
              with:
                  instance: ${{ env.INSTANCE }}
