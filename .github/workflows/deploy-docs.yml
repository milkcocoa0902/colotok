# This workflow is managed by gh actions-lock.

name: Build documentation

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

# Serialize publication so an older run cannot overwrite a newer deployment.
concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    quality:
        name: Verify quality before Pages deployment
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/workflows/quality.yml
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    deploy:
        name: Deploy checked documentation
        needs: quality
        if: ${{ github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
            pages: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Download checked documentation
              uses: actions/download-artifact@v4.3.0
              with:
                  name: docs
                  path: artifacts

            - name: Unzip artifact
              run: unzip -O UTF-8 -qq artifacts/webHelpCD2-all.zip -d dir

            - name: Setup Pages
              uses: actions/configure-pages@v5.0.0

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3.0.1
              with:
                  path: dir

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4.0.5
